<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shaadi Sorted</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span>Shaadi Sorted</div>
    <div class="top-actions">
      <button id="safety-btn" class="chip-btn hidden" title="Defenses that fired">Safety <b id="safety-count">0</b></button>
      <button id="meter-btn" class="chip-btn" title="Token usage">Tokens <b id="meter-total">0</b></button>
      <button id="reset-btn" class="chip-btn ghost hidden">Start over</button>
    </div>
    <div id="meter-pop" class="popover hidden"></div>
    <div id="safety-pop" class="popover hidden"></div>
  </header>

  <div id="banner" class="banner hidden"></div>
  <div id="loading" class="loading hidden"><div class="spinner"></div><p id="loading-text">Planning...</p></div>

  <main id="app"></main>
  <script src="/static/app.js"></script>
</body>
</html>
